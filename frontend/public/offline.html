<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1f4fff" />
    <title>Sin conexión · TuDestino</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f4f5f7;
        color: #14171f;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      main {
        width: 100%;
        max-width: 420px;
        text-align: center;
        background: #fff;
        border-radius: 28px;
        padding: 40px 28px;
        box-shadow: 0 10px 30px rgba(20, 23, 31, 0.08);
      }
      .logo {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
      }
      h1 {
        font-size: 26px;
        font-weight: 600;
        margin: 0 0 8px;
      }
      p {
        color: #5f6673;
        line-height: 1.5;
        margin: 0 0 24px;
      }
      a,
      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 28px;
        border: 0;
        border-radius: 999px;
        background: #1f4fff;
        color: #fff;
        font: inherit;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
      }
      a:hover,
      button:hover {
        background: #1a3fd1;
      }
      a:focus-visible,
      button:focus-visible {
        outline: 3px solid #14171f;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="72" height="72" fill="none" stroke="#1f4fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="50" cy="50" r="46"/><path d="M43 68 C43 60 50 58 49 51 C42 48 29 44 22 28 C31 33 42 32 52 40 C62 32 72 33 80 28 C73 44 60 48 57 51 C58 58 51 60 51 68"/><path d="M26 74 Q33 67 40 74 T54 74 T68 74 T74 74"/><path d="M36 85 Q43 79 50 85 T64 85"/></svg>
      </div>
      <h1>Sin conexión</h1>
      <p>
        No pudimos cargar esta página. Revisa tu señal: los destinos que ya visitaste siguen disponibles
        cuando vuelvas a la app.
      </p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
